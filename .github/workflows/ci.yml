name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Run release gate
        env:
          VERSION_OVERRIDE: v0.3.4
          SOURCE_DATE_EPOCH: "0"
        run: ./scripts/ci

      - name: Record the verified release product
        shell: bash
        run: |
          set -euo pipefail
          artifact=dist/artifacts/secret-delivery-api-0.3.4-linux-amd64.tar.xz
          test -f "$artifact"
          mkdir -p release-evidence
          git rev-parse HEAD > release-evidence/source-revision.txt
          git rev-parse 'HEAD^{tree}' > release-evidence/source-tree.txt
          go version -m bin/secret-delivery-api > release-evidence/go-version.txt
          sha256sum bin/secret-delivery-api "$artifact" > release-evidence/SHA256SUMS
          cp "$artifact" release-evidence/

      - name: Upload the verified release product
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-delivery-api-release-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
